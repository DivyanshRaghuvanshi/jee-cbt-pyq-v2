<header><h1 id="ttl">JEE PYQ CBT Practice</h1><span class="by">Made by <b>DIVYANSH</b></span><span class="sp"></span><span id="tm" hidden></span><button onclick="tg()" id="thm" aria-label="Toggle dark mode">Dark mode</button></header>
<div class="wrap" id="app"></div>
<div id="ov" hidden><div class="box"><b id="ovt">Working…</b><div class="pb"><i id="ovb"></i></div><small id="ovs"></small></div></div>
<script type="module">import*as p from"./lib/pdf.min.mjs";p.GlobalWorkerOptions.workerSrc="./lib/pdf.worker.min.mjs";window.pdfjsLib=p;dispatchEvent(new Event("pdfready"))</script>
<script>
/* =====================================================================
   JEE PYQ CBT Practice  -  made by DIVYANSH
   Reads MathonGo-style "Top 500 PYQs" PDFs (questions + answer key at the end).
   Everything runs in the browser. Progress is kept in localStorage and can be
   exported / imported as a JSON file.
   ===================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],A=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let STORE_FAIL=false;
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){STORE_FAIL=true}return null};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'book';
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')};
const SC=2.5; /* render scale for question images */

/* ---------- theme ---------- */
function theme(t){document.documentElement.classList.toggle('dark',t=='dark');$('#thm').textContent=t=='dark'?'Light mode':'Dark mode';ls('jp_theme',t)}
function tg(){theme(document.documentElement.classList.contains('dark')?'light':'dark')}
theme(ls('jp_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

/* ---------- settings (remembered) ---------- */
const CFG=Object.assign({tm:'q',mins:2,mp:4,mn:4,shuf:false,auto:true,z:1.5,name:'',mode:'ch',rule:'all',n:5,a:1,b:5,filt:['new','skipped']},(()=>{try{return JSON.parse(ls('jp_cfg')||'{}')}catch(e){return{}}})());
const saveCfg=()=>ls('jp_cfg',JSON.stringify(CFG));
document.documentElement.style.setProperty('--z',CFG.z);

/* ---------- progress database ---------- */
function loadDB(){try{const d=JSON.parse(ls('jp_db')||'null');if(d&&d.books)return{books:d.books,hist:d.hist||[],folders:d.folders||{},sv:d.sv||{}}}catch(e){}return{books:{},hist:[],folders:{},sv:{}}}
let DB=loadDB();
const saveDB=()=>ls('jp_db',JSON.stringify(DB));
const setDirty=v=>ls('jp_dirty',v?'1':'0');
const isDirty=()=>ls('jp_dirty')=='1';
const st=(b,n)=>{const r=DB.books[b.slug]&&DB.books[b.slug].q[n];return!r?'new':r.s=='c'?'correct':r.s=='w'?'wrong':'skipped'};

/* ---------- state ---------- */
let BOOKS=[],S=null,iv=null,PL=null;
const SEL={chs:new Set(),bk:0,nums:'',pages:'',fo:new Set()};
const FILT=new Set(CFG.filt);
const pdfReady=()=>window.pdfjsLib?Promise.resolve():new Promise((ok,no)=>{addEventListener('pdfready',ok,{once:true});setTimeout(()=>no(new Error('the PDF reader did not load - open the website over http/https (not as a local file)')),10000)});
const ov=(t,p,s)=>{$('#ov').hidden=t===null;if(t!==null){$('#ovt').textContent=t;$('#ovb').style.width=Math.round((p||0)*100)+'%';$('#ovs').textContent=s||''}};

/* =====================================================================
   PDF reading
   ===================================================================== */
function rowsText(items){ /* items -> text in reading order (row by row) */
 const a=items.slice().sort((p,q)=>p.y-q.y||p.x-q.x),L=[];
 for(const it of a){const l=L[L.length-1];if(l&&Math.abs(l.y-it.y)<=3)l.it.push(it);else L.push({y:it.y,it:[it]})}
 return L.map(l=>l.it.sort((p,q)=>p.x-q.x).map(i=>i.s).join(' ')).join(' ')}
function parseKey(text){const m={},re=/(\d{1,4})\s*\.\s*(\(\s*[1-4]\s*\)|[-−–]?\s*\d+(?:\.\d+)?)/g;let x;
 while((x=re.exec(text))){const n=+x[1];if(m[n]!==undefined)continue;const v=x[2].replace(/\s+/g,'').replace(/[−–]/g,'-');m[n]=v[0]=='('?{t:'S',a:v.replace(/[()]/g,'')}:{t:'N',a:v}}
 return m}

async function parseBook(file,onp){
 await pdfReady();
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,N=pdf.numPages;
 const pages=[],keyItems=[];let keyP=0,keyY=0,title='';
 for(let p=1;p<=N;p++){
  onp&&onp(p,N);
  const pg=await pdf.getPage(p),vp=pg.getViewport({scale:1}),W=vp.width,H=vp.height,tc=await pg.getTextContent(),I=[];
  for(const it of tc.items){const s=(it.str||'').trim();if(!s)continue;const[x,y]=vp.convertToViewportPoint(it.transform[4],it.transform[5]);I.push({s,x,y,h:it.height||10,w:it.width||0})}
  pg.cleanup();
  const P={p,W,H,marks:[],opt:[],top0:.07*H,bot:.93*H};
  const hd=I.filter(i=>i.y<.075*H);
  if(hd.length){P.top0=Math.max(...hd.map(i=>i.y))+8;if(!title){const t=rowsText(hd).replace(/\s*MathonGo\s*$/i,'').trim();if(/PYQ|Top\s*\d+/i.test(t))title=t}}
  const ft=I.find(i=>/^Text\s*&\s*Video/i.test(i.s));if(ft)P.bot=ft.y-11;
  const kh=I.find(i=>/^ANSWER\s*KEYS?$/i.test(i.s));
  if(kh&&!keyP){keyP=p;keyY=kh.y}
  const isKey=keyP&&p>=keyP;
  if(isKey){for(const i of I){if(p===keyP&&i.y<=keyY+1)continue;if(i.y<P.top0||i.y>P.bot+4)continue;keyItems.push({p,x:i.x,y:i.y,s:i.s})}}
  if(!(isKey&&p>keyP)){
   for(const i of I){
    if(isKey&&p===keyP&&i.y>keyY+1)continue;
    let m;
    if(i===kh){P.marks.push({t:'k',y:i.y,top:i.y-i.h-2})}
    else if(i.x<.2*W&&(m=i.s.match(/^Q\s*(\d+)\s*\.\s*(.*)$/))){
     const line=I.filter(o=>o!==i&&Math.abs(o.y-i.y)<2.5&&o.x>i.x).sort((a,b)=>a.x-b.x);
     const title2=(m[2]+' '+line.map(o=>o.s).join(' ')).trim(),x1=Math.max(i.x+i.w,...line.map(o=>o.x+o.w));
     P.marks.push({t:'q',n:+m[1],title:title2,y:i.y,top:i.y-i.h-1.5,mask:{x0:i.x-3,x1:x1+3,y0:i.y-i.h-1.5,y1:i.y+i.h*.4}})}
    else if(i.x<.2*W&&/^Chapter\s*:/i.test(i.s)){
     let name=i.s.replace(/^Chapter\s*:\s*/i,'').trim();
     if(!name){const o=I.filter(o=>o!==i&&Math.abs(o.y-i.y)<2.5&&o.x>i.x).sort((a,b)=>a.x-b.x);name=o.map(z=>z.s).join(' ')}
     P.marks.push({t:'c',name,y:i.y,top:i.y-i.h-2})}
    if(/^\(\s*1\s*\)/.test(i.s))P.opt.push(i.y)}
  }
  pages.push(P)}
 /* ---- build the question index ---- */
 const chs=[],cmap=new Map(),qs=[];let cur=null,last=null,lastN=0;
 const chap=name=>{const k=name.toLowerCase().replace(/[^a-z0-9]+/g,'');let c=cmap.get(k);if(!c){c={name:name||'Questions',qs:[]};cmap.set(k,c);chs.push(c)}return c};
 for(const P of pages){
  if(keyP&&P.p>keyP)break;
  let ms=P.marks.slice().sort((a,b)=>a.y-b.y),ln=lastN;
  ms=ms.filter(m=>{if(m.t!='q')return true;if(m.n<=ln)return false;ln=m.n;return true});
  const e0=ms.length?ms[0].top:P.bot;
  if(last&&e0-P.top0>4&&!(ms.length&&ms[0].t=='k'))last.segs.push({p:P.p,y0:P.top0,y1:e0});
  const prev=last;
  ms.forEach((m,i)=>{
   if(m.t=='c'){cur=chap(m.name);return}
   if(m.t!='q')return;
   if(!cur)cur=chap('All questions');
   const nx=ms[i+1],q={n:m.n,src:m.title,chn:cur.name,segs:[{p:P.p,y0:m.top,y1:nx?nx.top:P.bot,mk:m.mask}],opt1:false,ans:null,type:null};
   qs.push(q);cur.qs.push(q);last=q;lastN=m.n;m.q=q});
  for(const y of P.opt){let o=null;for(const m of ms)if(m.t=='q'&&m.y<=y)o=m.q;o=o||prev;if(o)o.opt1=true}
 }
 /* ---- answer key ---- */
 const byP={};keyItems.forEach(k=>(byP[k.p]=byP[k.p]||[]).push(k));
 const key=parseKey(Object.keys(byP).sort((a,b)=>a-b).map(p=>rowsText(byP[p])).join(' '));
 const warn=[];let nk=0;
 for(const q of qs){const k=key[q.n];if(k){q.ans=k.a;q.type=k.t;nk++}else{q.type=q.opt1?'S':'N'}}

/* ---- render selected questions to images ---- */
function crop(cx,W,H,a,b){
 a=Math.max(0,Math.floor(a));b=Math.min(H,Math.ceil(b));const h=b-a;if(h<6)return null;
 const x0=Math.floor(W*.05),w=Math.floor(W*.97)-x0,d=cx.getImageData(x0,a,w,h).data;let f=-1,l=-1;
 for(let r=0;r<h;r++){for(let c=0;c<w;c+=2){const i=(r*w+c)*4;if(d[i]+d[i+1]+d[i+2]<390){if(f<0)f=r;l=r;break}}}
 if(f<0)return null;
 const y0=Math.max(0,f-8),y1=Math.min(h,l+10),c2=document.createElement('canvas');c2.width=w;c2.height=y1-y0;
 const g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,y1-y0);g.drawImage(cx.canvas,x0,a+y0,w,y1-y0,0,0,w,y1-y0);return c2}
async function renderBook(bk,qs,cb){
 const byPage=new Map(),pieces=new Map();
 qs.forEach(q=>q.segs.forEach(sg=>{if(!byPage.has(sg.p))byPage.set(sg.p,[]);byPage.get(sg.p).push({q,sg})}));
 const pgs=[...byPage.keys()].sort((a,b)=>a-b);let k=0;
 for(const p of pgs){
  cb(k/pgs.length,'Page '+p+' ('+(k+1)+' of '+pgs.length+')');
  const pg=await bk.pdf.getPage(p),vp=pg.getViewport({scale:SC}),cv=document.createElement('canvas');
  cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
  const cx=cv.getContext('2d',{willReadFrequently:true});cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:cx,viewport:vp}).promise;
  for(const{q,sg}of byPage.get(p)){
   if(sg.mk){cx.fillStyle='#fff';cx.fillRect(sg.mk.x0*SC,sg.mk.y0*SC,(sg.mk.x1-sg.mk.x0)*SC,(sg.mk.y1-sg.mk.y0)*SC)}
   const c=crop(cx,cv.width,cv.height,sg.y0*SC,sg.y1*SC);if(c){if(!pieces.has(q))pieces.set(q,[]);pieces.get(q).push(c)}}
  pg.cleanup();k++;await new Promise(r=>setTimeout(r,0))}
 for(const q of qs){
  const ps=pieces.get(q);if(!ps||!ps.length){bk.img.set(q.n,null);continue}
  const w=Math.max(...ps.map(c=>c.width)),h=ps.reduce((a,c)=>a+c.height+4,0),c=document.createElement('canvas');
  c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);let y=0;ps.forEach(s=>{x.drawImage(s,0,y);y+=s.height+4});
  bk.img.set(q.n,{url:c.toDataURL('image/jpeg',.9),ptw:Math.round(w/SC),np:ps.length})}
}

 let done=0;const total=[...by.values()].reduce((a,l)=>a+l.length,0);
 for(const[bk,qs]of by){await renderBook(bk,qs,(f,s)=>ov('Preparing '+items.length+' questions…',(done+f*qs.length)/Math.max(1,total),bk.subject+' · '+s));done+=qs.length}
 ov(null);
 const q=items.map(x=>({bk:x.bk,qo:x.q,n:x.q.n,t:x.q.type||'S',a:x.q.ans||'',img:x.bk.img.get(x.q.n),ch:x.q.chn,src:x.q.src,sub:x.bk.subject})),n=q.length;
 const secs=[];q.forEach((x,i)=>{let s=secs.find(z=>z.bk===x.bk);if(!s)secs.push(s={bk:x.bk,name:x.sub,idx:[]});s.idx.push(i)});
 const ord=secs.flatMap(s=>s.idx);const q2=ord.map(i=>q[i]);const secs2=[];let k=0;secs.forEach(s=>{secs2.push({name:s.name,idx:s.idx.map(()=>k++)})});
 const tot=totalSecs(n);
 S={name,q:q2,secs:secs2,mp:CFG.mp,mn:Math.abs(CFG.mn),auto:CFG.auto,r:Array(n).fill(''),st:Array(n).fill(0),tm:Array(n).fill(0),cur:0,end:Date.now()+tot*1000,t0:Date.now(),tot,done:0};
 S.st[0]=1;$('#tm').hidden=false;$('#tm').classList.remove('ot');$('#ttl').textContent=name;
 iv=setInterval(()=>{const r=Math.ceil((S.end-Date.now())/1000),t=$('#tm');
  if(r>0)t.textContent='Time Left : '+fmt(r);
  else if(S.auto)finish();
  else{t.textContent='Overtime : +'+fmt(-r);t.classList.add('ot')}},500);
 exam()}

 else a=`<div class="opts">${['1','2','3','4'].map(o=>`<button class="opt ${r==o?'on':''}" aria-pressed="${r==o}" onclick="pick('${o}')">${o}</button>`).join('')}</div>`;

function pick(o){S.r[S.cur]=S.r[S.cur]==o?'':o;upd()}
function kp(k){let r=S.r[S.cur];if(k=='C')r='';else if(k=='⌫')r=r.slice(0,-1);else if(k=='-'){r=r.startsWith('-')?r.slice(1):'-'+r}else if(k=='.'){if(!r.includes('.'))r+='.'}else if(r.length<12)r+=k;S.r[S.cur]=r;upd()}
function clr(){const i=S.cur;S.r[i]='';S.st[i]=S.st[i]>=3?3:1;exam()}

function sub(){tick();const at=S.r.filter(x=>x!=='').length;if(confirm('Attempted '+at+' of '+S.q.length+'. Unattempted: '+(S.q.length-at)+'. Submit now?'))finish()}

addEventListener('keydown',e=>{
 if(!S||S.done||e.ctrlKey||e.metaKey||e.altKey||$('#md'))return;const t=e.target&&e.target.tagName;if(t=='INPUT'||t=='TEXTAREA'||t=='SELECT')return;
 const q=S.q[S.cur];
 if(e.key=='ArrowRight'){go(Math.min(S.cur+1,S.q.length-1))}else if(e.key=='ArrowLeft'){go(Math.max(S.cur-1,0))}
 else if(q.t=='S'&&/^[1-4]$/.test(e.key))pick(e.key);
 else if(q.t=='N'){if(/^[0-9.]$/.test(e.key)||e.key=='-')kp(e.key);else if(e.key=='Backspace')kp('⌫');else if(e.key=='Delete')kp('C')}});
addEventListener('beforeunload',e=>{if(pt)saveDB();if(S&&!S.done){e.preventDefault();e.returnValue=''}});

function grade(q,r){
 if(!q.a)return null;
 if(q.t=='N'){const v=parseFloat(q.a),x=parseFloat(r);if(isNaN(v))return null;if(isNaN(x))return false;
  const d=(q.a.split('.')[1]||'').length;return d?Math.abs(x-v)<=.5*Math.pow(10,-d)+1e-9:Math.abs(x-v)<1e-9}
 return r==q.a}
const show=(q,v)=>v===''||v==null?'-':v;
function grp(R,fn){const m=new Map();R.forEach(x=>{const k=fn(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return[...m]}
function finish(){
 if(!S||S.done)return;S.done=1;clearInterval(iv);tick();$('#tm').hidden=true;
 const R=S.q.map((q,i)=>{const r=S.r[i],att=r!=='',c=att?grade(q,r):null;
  return{i,q,att,c,m:!att||c===null?0:c?S.mp:-S.mn,t:S.tm[i],s:!att||c===null?'sk':c?'ok':'no'}});
 const sc=R.reduce((a,x)=>a+x.m,0),mx=S.q.length*S.mp,co=R.filter(x=>x.att&&x.c===true),wr=R.filter(x=>x.att&&x.c===false),un=R.filter(x=>!x.att),ug=R.filter(x=>x.att&&x.c===null);
 const sum=a=>a.reduce((s,x)=>s+x.t,0),used=sum(R),acc=co.length+wr.length?Math.round(100*co.length/(co.length+wr.length)):0,avg=used/Math.max(1,R.length);
 /* save progress */
 const now=Date.now();
 R.forEach(x=>{const b=DB.books[x.q.bk.slug]||(DB.books[x.q.bk.slug]={name:x.q.bk.name,q:{}}),old=b.q[x.q.n]||{};
  b.q[x.q.n]={s:x.att&&x.c===true?'c':x.att&&x.c===false?'w':'u',a:(old.a||0)+1,w:(old.w||0)+(x.att&&x.c===false?1:0),t:Math.round(x.t),ts:now}});
 DB.hist.push({id:now,ts:now,name:S.name,date:new Date().toLocaleString(),score:sc,max:mx,acc,time:Math.round(used),n:S.q.length,co:co.length,wr:wr.length,un:un.length+ug.length,
  qs:R.map(x=>[x.q.bk.slug,x.q.n,S.r[x.i],x.q.a,Math.round(x.t),x.m])});
 DB.hist=DB.hist.slice(-150);saveDB();setDirty(true);
 /* analysis */
 const max=Math.max(sum(co),sum(wr),sum(un),1),bar=(l,a,cl)=>`<div style="margin:6px 0">${l}: <b>${fmt(sum(a))}</b> <small>(avg ${a.length?fmt(sum(a)/a.length):'0:00'} over ${a.length})</small><br><span class="tb" style="background:${cl};width:${Math.max(2,sum(a)/max*100)}%"></span></div>`;
 const sl=R.slice().sort((a,b)=>b.t-a.t).slice(0,5);
 const stat=a=>{const c=a.filter(x=>x.att&&x.c===true).length,w=a.filter(x=>x.att&&x.c===false).length;return{n:a.length,c,w,u:a.length-c-w,m:a.reduce((s,x)=>s+x.m,0),t:sum(a),acc:c+w?Math.round(100*c/(c+w)):null}};
 const tbl=(title,g)=>`<tr><th>${title}</th><th>Qs</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Marks</th><th>Accuracy</th><th>Time</th></tr>`+g.map(([k,a])=>{const s=stat(a);return`<tr><td>${esc(k)}</td><td>${s.n}</td><td class="ok">${s.c}</td><td class="no">${s.w}</td><td class="sk">${s.u}</td><td>${s.m}</td><td>${s.acc==null?'-':`<span class="ab"><i style="width:${s.acc}%"></i></span> ${s.acc}%`}</td><td>${fmt(s.t)}</td></tr>`}).join('');
 const rushed=wr.filter(x=>x.t<avg*.5).length,slowW=wr.filter(x=>x.t>avg*1.5).length,slowC=co.filter(x=>x.t>avg*2).length;
 const ins=[];
 if(co.length&&wr.length)ins.push(`Average time: <b>${fmt(sum(co)/co.length)}</b> on correct vs <b>${fmt(sum(wr)/wr.length)}</b> on wrong answers.`);
 if(rushed)ins.push(`<b>${rushed}</b> wrong answer(s) took under half the average time - possible rushing or guessing.`);
 if(slowW)ins.push(`<b>${slowW}</b> wrong answer(s) took over 1.5× the average - long time spent, still missed (revise these concepts).`);
 if(slowC)ins.push(`<b>${slowC}</b> correct answer(s) took over 2× the average - right but slow; practise for speed.`);
 const un0=un.filter(x=>x.t>5).length;if(un0)ins.push(`<b>${un0}</b> question(s) were opened for more than 5 s but left unanswered.`);
 if(ug.length)ins.push(`${ug.length} attempted question(s) had no answer key and were not graded.`);
 const multi=S.secs.length>1;
 const gch=grp(R,x=>(multi?x.q.sub+' - ':'')+x.q.ch);
 const lgd='<div class="lgd"><span><i style="background:var(--an)"></i>Correct</span><span><i style="background:var(--na)"></i>Wrong</span><span><i style="background:var(--nv)"></i>Skipped</span></div>';
 const stk=g=>g.map(([k,a])=>{const s=stat(a),n=s.n||1;return`<div class="sb"><div class="sbn" title="${esc(k)}">${esc(k)}</div><div class="sbt"><i style="width:${s.c/n*100}%;background:var(--an)"></i><i style="width:${s.w/n*100}%;background:var(--na)"></i></div><div class="sbv">${s.c} / ${s.w} / ${s.u}</div></div>`}).join('');
 A.className='wrap';scrollTo(0,0);$('#ttl').textContent='Result';
 A.innerHTML=`<div id="cDirty"></div><div class="card"><h2 style="margin:0 0 10px">${esc(S.name)}</h2><div class="stats">
 <div class="stat"><small>Score</small><b>${sc} / ${mx}</b></div><div class="stat"><small>Correct</small><b class="ok">${co.length}</b></div>
 <div class="stat"><small>Incorrect</small><b class="no">${wr.length}</b></div><div class="stat"><small>Unattempted</small><b>${un.length}</b></div>
 <div class="stat"><small>Accuracy</small><b>${acc}%</b></div><div class="stat"><small>Time used</small><b>${fmt(used)} / ${fmt(S.tot)}</b></div>
 <div class="stat"><small>Avg per question</small><b>${fmt(avg)}</b></div></div>
 <div class="bar"><button class="pri" onclick="setup()">New test</button>${wr.length+un.length?`<button onclick="retry()">Retry the ${wr.length+un.length} wrong / unattempted</button>`:''}<button onclick="dl()">Download progress file</button></div>
 <small>Your results were saved in this browser. Download the progress file so the app remembers them next time on any device.</small></div>
 <div class="g2"><div class="card"><h3>Result split</h3><div style="display:flex;gap:20px;align-items:center;flex-wrap:wrap">${gDonut(co.length,wr.length,un.length+ug.length,acc+'%')}<div style="line-height:1.9"><span class="ok">● Correct ${co.length}</span><br><span class="no">● Incorrect ${wr.length}</span><br><span class="sk">● Unattempted ${un.length+ug.length}</span><br><small>Marks: +${co.length*S.mp} − ${wr.length*S.mn} = <b>${sc}</b></small></div></div></div>
 <div class="card"><h3>Score trend <small>(last tests)</small></h3>${gTrend(DB.hist)}</div></div>

 <div class="g2"><div class="card"><h3>Time by result</h3>${bar('Correct',co,'var(--an)')}${bar('Incorrect',wr,'var(--na)')}${bar('Unattempted',un,'var(--mu)')}</div>
 <div class="card"><h3>Slowest questions</h3>${sl.map(x=>`Q${x.i+1}: <b>${fmt(x.t)}</b> <span class="${x.s}">${x.att?(x.c===null?'ungraded':x.c?'correct':'incorrect'):'unattempted'}</span><br>`).join('')}</div></div>
 ${ins.length?`<div class="card"><h3>What the timing says</h3><ul class="ins">${ins.map(i=>`<li>${i}</li>`).join('')}</ul></div>`:''}
 <div class="card"><h3>Chapter-wise</h3>${stk(gch)}${lgd}<div style="overflow-x:auto;margin-top:12px"><table>${tbl('Chapter',gch)}</table></div>${multi?`<h3 style="margin-top:16px">Subject-wise</h3><div style="overflow-x:auto"><table>${tbl('Subject',grp(R,x=>x.q.sub))}</table></div>`:''}</div>
 <div class="card"><h3 style="margin-top:0">Review <small>(click a row to see the question)</small></h3><div class="bar" style="margin:0 0 8px"><button onclick="fl('')">All</button><button onclick="fl('ok')">Correct</button><button onclick="fl('no')">Incorrect</button><button onclick="fl('sk')">Unattempted</button></div>
 <div style="overflow-x:auto"><table><tr><th>Q</th><th>Chapter</th><th>Source</th><th>Type</th><th>Your answer</th><th>Correct</th><th>Result</th><th>Marks</th><th>Time</th><th>Save</th></tr>
 ${R.map(x=>{const q=x.q;return`<tr class="r ${x.s}f" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden"><td>${x.i+1}</td><td>${esc(q.ch)}</td><td><small>${esc(q.src)}</small></td><td>${q.t}</td><td>${esc(show(q,S.r[x.i]))}</td><td>${q.a?esc(q.a):'?'}</td><td class="${x.s}">${x.att?(x.c===null?'Ungraded':x.c?'Correct':'Incorrect'):'Unattempted'}</td><td>${x.m}</td><td>${fmt(x.t)}</td><td><button class="plus ${isSaved(q.bk.slug+'#'+q.n)?'on':''}" data-k="${q.bk.slug}#${q.n}" onclick="event.stopPropagation();saveRev(${x.i})" title="Save to a folder" aria-label="Save to a folder">+</button></td></tr><tr hidden class="${x.s}f"><td colspan="10">${q.img?`<img class="q" style="width:calc(${q.img.ptw}px*var(--z))" src="${q.img.url}" alt="">`:'(image not available)'}</td></tr>`}).join('')}</table></div></div>
 <div class="pgfoot">Made by DIVYANSH</div>`;
 rDirty()}
function fl(c){document.querySelectorAll('tr.r').forEach(r=>{const m=!c||r.classList.contains(c+'f'),n=r.nextElementSibling;r.style.display=m?'':'none';n.hidden=true;n.style.display=m?'':'none'})}
async function retry(){
 const items=[];S.q.forEach((q,i)=>{const r=S.r[i],c=r!==''?grade(q,r):null;if(r===''||c===false)items.push({bk:q.bk,q:q.qo})});

/* =====================================================================
   Charts (inline SVG, no libraries)
   ===================================================================== */
function gDonut(co,wr,un,label){
 const t=co+wr+un||1,r=52,C=2*Math.PI*r;let off=0;
 const arc=(v,c)=>{if(!v)return'';const l=v/t*C,x=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${c}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 70 70)"/>`;off+=l;return x};
 return`<svg viewBox="0 0 140 140" width="160" height="160" role="img" aria-label="Result split"><circle cx="70" cy="70" r="${r}" fill="none" stroke="var(--nv)" stroke-width="22"/>${arc(co,'var(--an)')}${arc(wr,'var(--na)')}${arc(un,'var(--mu)')}<text x="70" y="69" text-anchor="middle" font-size="24" font-weight="700" fill="currentColor">${label}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="var(--mu)">accuracy</text></svg>`}
function gTime(R,avg){
 const n=R.length,bw=14,gap=5,L=40,Bm=24,H=180,W=Math.max(520,n*(bw+gap)+L+12),mx=Math.max(1,...R.map(x=>x.t)),ph=H-Bm-14,y=t=>H-Bm-(t/mx)*ph,step=n>40?5:n>20?2:1;
 const col=x=>x.s=='ok'?'var(--an)':x.att&&x.c===false?'var(--na)':'var(--mu)';
 let g=`<line x1="${L}" y1="${y(0)}" x2="${W-6}" y2="${y(0)}" stroke="var(--bd)"/><text x="${L-6}" y="${y(0)+4}" text-anchor="end" font-size="10" fill="var(--mu)">0</text><text x="${L-6}" y="${y(mx)+4}" text-anchor="end" font-size="10" fill="var(--mu)">${fmt(mx)}</text>`;
 R.forEach((x,i)=>{const h=Math.max(1.5,y(0)-y(x.t)),bx=L+i*(bw+gap)+gap;
  g+=`<rect x="${bx}" y="${y(0)-h}" width="${bw}" height="${h}" rx="2" fill="${col(x)}"><title>Q${i+1}: ${fmt(x.t)} - ${x.att?(x.c===null?'ungraded':x.c?'correct':'incorrect'):'unattempted'}</title></rect>`;
  if(i%step==0)g+=`<text x="${bx+bw/2}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--mu)">${i+1}</text>`});
 g+=`<line x1="${L}" y1="${y(avg)}" x2="${W-6}" y2="${y(avg)}" stroke="var(--pr)" stroke-dasharray="5 4" stroke-width="1.5"/>`;
 return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:${W}px;max-width:${Math.round(W*1.8)}px;height:auto" role="img" aria-label="Time per question">${g}</svg>`}
function gTrend(h){
 const a=h.slice(-12);if(a.length<2)return'<p class="mu" style="margin:6px 0 0">Take at least two tests to see your trend here.</p>';
 const W=420,H=175,L=34,Rr=12,T=12,B=26,pts=a.map(x=>x.max?Math.round(100*x.score/x.max):0),acc=a.map(x=>x.acc||0),lo=Math.min(0,...pts),hi=100;
 const X=i=>L+i*(W-L-Rr)/(a.length-1),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 const line=(vs,c,nm)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" points="${vs.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`+vs.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="${c}"><title>${esc(a[i].name)} - ${nm}: ${v}%</title></circle>`).join('');
 let g='';[0,50,100].forEach(v=>{g+=`<line x1="${L}" y1="${Y(v)}" x2="${W-Rr}" y2="${Y(v)}" stroke="var(--bd)"/><text x="${L-5}" y="${Y(v)+3}" text-anchor="end" font-size="10" fill="var(--mu)">${v}%</text>`});
 a.forEach((_,i)=>{g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="9" fill="var(--mu)">${i+1}</text>`});
 return`<div class="chart"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:300px;max-width:560px;height:auto" role="img" aria-label="Score trend">${g}${line(acc,'var(--an)','accuracy')}${line(pts,'var(--pr)','score')}</svg></div><div class="lgd"><span><i style="background:var(--pr)"></i>Score % of max</span><span><i style="background:var(--an)"></i>Accuracy %</span></div>`}

   ===================================================================== */
let pt=null;
function persist(){setDirty(true);clearTimeout(pt);pt=setTimeout(()=>{pt=null;saveDB()},300);rDirty()}
const uid=()=>'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const activeFolders=()=>Object.entries(DB.folders).filter(([,f])=>!f.del).sort((a,b)=>(a[1].c||0)-(b[1].c||0)).map(([id,f])=>({id,name:f.name}));
const folderName=id=>DB.folders[id]&&!DB.folders[id].del?DB.folders[id].name:null;
const itFolders=it=>(it&&it.f||[]).filter(folderName);
const isSaved=k=>itFolders(DB.sv[k]).length>0;
const splitK=k=>{const i=k.lastIndexOf('#');return{slug:k.slice(0,i),n:+k.slice(i+1)}};
const bIdx=s=>{const i=BOOKS.findIndex(b=>b.slug==s);return i<0?99:i};
function qMeta(k){const{slug,n}=splitK(k),book=BOOKS.find(b=>b.slug==slug)||null,q=book?book.byNum.get(n)||null:null;
 return{k,slug,n,book,q,subject:book?book.subject:((DB.books[slug]&&DB.books[slug].name)||slug)}}
function savedKeys(fid){return Object.keys(DB.sv).filter(k=>{const f=itFolders(DB.sv[k]);return fid&&fid!=='all'?f.includes(fid):f.length>0}).sort((a,b)=>{const x=splitK(a),y=splitK(b);return bIdx(x.slug)-bIdx(y.slug)||x.slug.localeCompare(y.slug)||x.n-y.n})}
function mkFolder(name){name=(name||'').trim().slice(0,60);if(!name)return null;
 const ex=Object.entries(DB.folders).find(([,f])=>!f.del&&f.name.toLowerCase()==name.toLowerCase());if(ex)return ex[0];
 const id=uid();DB.folders[id]={name,c:Date.now(),ts:Date.now()};persist();return id}
const item=k=>DB.sv[k]||(DB.sv[k]={f:[],note:'',fn:{},ts:0});
function setFolder(k,fid,on){const it=item(k),has=it.f.includes(fid);if(on&&!has)it.f.push(fid);if(!on&&has)it.f=it.f.filter(x=>x!=fid);it.ts=Date.now();persist()}
function setNote(k,scope,text){const it=item(k);if(scope=='all')it.note=text;else{it.fn=it.fn||{};it.fn[scope]=text}it.ts=Date.now();persist()}
function renameFolder(fid){const f=DB.folders[fid];if(!f)return;const n=prompt('Folder name',f.name);if(n&&n.trim()){f.name=n.trim().slice(0,60);f.ts=Date.now();persist()}}
function deleteFolder(fid){const f=DB.folders[fid];if(!f)return false;
 if(!confirm('Delete folder "'+f.name+'"? The questions stay in your other folders; notes written only for this folder are lost.'))return false;
 f.del=true;f.ts=Date.now();Object.values(DB.sv).forEach(it=>{if(it.f.includes(fid)){it.f=it.f.filter(x=>x!=fid);if(it.fn)delete it.fn[fid];it.ts=Date.now()}});persist();return true}
const refreshPlus=()=>$$('.plus[data-k]').forEach(b=>b.classList.toggle('on',isSaved(b.dataset.k)));
const saveCur=()=>{const q=S.q[S.cur];openSave(q.bk.slug,q.n,q.sub+' Q'+q.n,refreshPlus)};
const saveRev=i=>{const q=S.q[i];openSave(q.bk.slug,q.n,q.sub+' Q'+q.n,refreshPlus)};

/* ---- the "add to folder" popup ---- */
let MD=null;
function openSave(slug,n,label,cb){MD={k:slug+'#'+n,label,scope:'all',adding:false,cb};renderMd()}
function closeMd(){const m=$('#md');if(m)m.remove();const cb=MD&&MD.cb;MD=null;if(cb)cb()}
function renderMd(){
 let m=$('#md');if(!m){m=document.createElement('div');m.id='md';m.onclick=closeMd;document.body.appendChild(m)}
 const it=DB.sv[MD.k]||{f:[],note:'',fn:{}},mine=new Set(itFolders(it)),fs=activeFolders();
 if(MD.scope!='all'&&!mine.has(MD.scope))MD.scope='all';
 const note=MD.scope=='all'?(it.note||''):((it.fn||{})[MD.scope]||'');
 m.innerHTML=`<div class="mbox" role="dialog" aria-label="Save to folder" onclick="event.stopPropagation()">
  <div class="mh"><b>Save to folder</b><span class="mu">${esc(MD.label)}</span><span class="sp"></span><button class="sm pri" onclick="closeMd()">Done</button></div>
  <div class="mfl">${fs.length?fs.map(f=>`<label class="chk mrow"><input type="checkbox" ${mine.has(f.id)?'checked':''} onchange="mdTog('${f.id}',this.checked)"> ${esc(f.name)}</label>`).join(''):'<p class="mu" style="margin:8px 0">No folders yet - add your first one below.</p>'}</div>
  ${MD.adding?`<div class="bar" style="margin:8px 0 0"><input id="nf" placeholder="Folder name" maxlength="60" onkeydown="if(event.key=='Enter')mdAdd()"><button class="pri" onclick="mdAdd()">Add</button></div>`:`<button class="sm" style="margin-top:8px" onclick="MD.adding=true;renderMd()">＋ Add new folder</button>`}
  <label>Note <small>(optional)</small></label>
  <select onchange="MD.scope=this.value;renderMd()"><option value="all" ${MD.scope=='all'?'selected':''}>For all folders</option>${fs.filter(f=>mine.has(f.id)).map(f=>`<option value="${f.id}" ${MD.scope==f.id?'selected':''}>Only for "${esc(f.name)}"</option>`).join('')}</select>
  <textarea id="mnote" rows="3" style="margin-top:6px" placeholder="Write a note - the trick, your mistake, why it is a good question…" oninput="setNote(MD.k,MD.scope,this.value)">${esc(note)}</textarea></div>`;
 const nf=$('#nf');if(nf)nf.focus()}
function mdTog(fid,on){setFolder(MD.k,fid,on);renderMd()}
function mdAdd(){const id=mkFolder($('#nf').value);MD.adding=false;if(id)setFolder(MD.k,id,true);renderMd()}
addEventListener('keydown',e=>{if(e.key=='Escape'&&MD)closeMd()});

/* ---- home-screen card ---- */
function rSaved(){const e=$('#cSaved');if(!e)return;const fs=activeFolders(),n=savedKeys('all').length;
 e.innerHTML=`<div class="card" style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><div style="flex:1;min-width:200px"><h2 style="margin:0">★ Saved questions</h2><small>${n?n+' question'+(n==1?'':'s')+' in '+fs.length+' folder'+(fs.length==1?'':'s')+'. Open them, read your notes, or practise a folder.':'Save good questions into your own folders with the ⊕ button during a test.'}</small></div><button class="pri" onclick="showSaved()">Open saved questions</button></div>`}

/* ---- saved questions screens ---- */
let SV={fid:null,shown:0,q:'',keys:[]},SVQ=Promise.resolve();
function showSaved(fid){SV={fid:fid||null,shown:0,q:'',keys:[]};A.className='wrap';$('#ttl').textContent='Saved questions';scrollTo(0,0);SV.fid?svFolder():svFolders()}
function svFolders(){
 const fs=activeFolders(),total=savedKeys('all').length;
 A.innerHTML=`<div class="bar" style="margin:0 0 10px"><button onclick="setup()">← Back</button></div>
 <div class="card"><h2>★ Saved questions</h2><small>Your folders. Open one to see its questions and notes, or practise it as a test. A question saved in two folders is counted once.</small>
  <div class="frow"><div class="fn"><b>All saved questions</b> <small>${total} unique</small></div><button onclick="showSaved('all')">Open</button><button class="pri" onclick="practiceFolders(null)" ${total?'':'disabled'}>Practice</button></div>
  ${fs.map(f=>{const c=savedKeys(f.id).length;return`<div class="frow"><label class="fn" style="margin:0;font-weight:400"><input type="checkbox" class="fck" value="${f.id}"> <b>${esc(f.name)}</b> <small>${c} question${c==1?'':'s'}</small></label><button onclick="showSaved('${f.id}')">Open</button><button class="pri" onclick="practiceFolders(['${f.id}'])" ${c?'':'disabled'}>Practice</button><button onclick="svRename('${f.id}')">Rename</button><button onclick="svDelete('${f.id}')">Delete</button></div>`}).join('')}
  <div class="bar"><input id="nfn" placeholder="New folder name" maxlength="60" style="max-width:260px" onkeydown="if(event.key=='Enter')svAdd()"><button onclick="svAdd()">＋ Add folder</button><span class="sp"></span><button class="pri" onclick="practiceChecked()">Practice ticked folders (duplicates removed)</button></div>
  ${fs.length?'':'<p class="mu">No folders yet. During a test (or in the results review) click the ⊕ button on a question to create one, or add one here.</p>'}</div>
 <div class="pgfoot">Made by DIVYANSH</div>`}
const svAdd=()=>{mkFolder($('#nfn').value);svFolders()};
const svRename=id=>{renameFolder(id);svFolders()};
const svDelete=id=>{if(deleteFolder(id))svFolders()};
function practiceFolders(ids){SEL.fo=new Set(ids||activeFolders().map(f=>f.id));CFG.mode='fo';saveCfg();setup();setTimeout(()=>{const e=$('#cSel');if(e)e.scrollIntoView()},60)}
function practiceChecked(){const ids=$$('.fck:checked').map(x=>x.value);if(!ids.length)return alert('Tick at least one folder first.');practiceFolders(ids)}
function foPanel(){const fs=activeFolders();
 return fs.length?`<div class="chl">${fs.map(f=>`<label class="chr ${SEL.fo.has(f.id)?'on':''}"><input type="checkbox" ${SEL.fo.has(f.id)?'checked':''} onchange="togFo('${f.id}',this.checked,this.parentNode)"><span class="cn">${esc(f.name)}</span><span class="cc"><b>${savedKeys(f.id).length}</b> questions</span></label>`).join('')}</div><small>A question saved in two folders is included only once. The status filter does not apply to folders.</small>`
 :'<p class="mu">No folders yet. During a test click the ⊕ button on a question to save it into a folder; the folders then appear here.</p>'}
function togFo(id,on,el){on?SEL.fo.add(id):SEL.fo.delete(id);el.classList.toggle('on',on);refreshPlan()}

function svFolder(){
 const fid=SV.fid,all=fid=='all';if(!all&&!folderName(fid))return showSaved();
 A.innerHTML=`<div class="bar" style="margin:0 0 10px"><button onclick="showSaved()">← Folders</button></div>
 <div class="card"><div class="bar" style="margin:0"><h2 style="margin:0">${all?'★ All saved questions':'Folder: '+esc(folderName(fid))}</h2><small id="svc"></small><span class="sp"></span><button class="pri" onclick="practiceFolders(${all?'null':`['${fid}']`})">Practice ${all?'all':'this folder'}</button></div>
 <input id="svq" placeholder="Search notes, chapter, question number…" value="${esc(SV.q)}" style="margin-top:10px" oninput="SV.q=this.value;svList()"></div>
 <div id="svl"></div><div class="bar" style="justify-content:center"><button id="svm" onclick="svMore(20)">Show more</button></div><div class="pgfoot">Made by DIVYANSH</div>`;
 svList()}
function svFiltered(){const q=SV.q.trim().toLowerCase(),ks=savedKeys(SV.fid);if(!q)return ks;
 return ks.filter(k=>{const m=qMeta(k),it=DB.sv[k];return[it.note,...Object.values(it.fn||{}),m.q&&m.q.chn,m.q&&m.q.src,m.subject,'q'+m.n,String(m.n)].join(' ').toLowerCase().includes(q)})}
function svList(keep){
 const box=$('#svl');if(!box)return;const n=keep?Math.max(SV.shown,20):20;
 SV.keys=svFiltered();SV.shown=0;box.innerHTML='';
 $('#svc').textContent=SV.keys.length+' question'+(SV.keys.length==1?'':'s');
 if(!SV.keys.length){box.innerHTML='<div class="card mu">Nothing here yet. Save questions with the ⊕ button during a test or in the results review.</div>';$('#svm').hidden=true;return}
 svMore(n)}
function svMore(cnt){
 const box=$('#svl'),from=SV.shown,to=Math.min(SV.keys.length,from+cnt),part=SV.keys.slice(from,to);
 box.insertAdjacentHTML('beforeend',part.map(svCard).join(''));SV.shown=to;$('#svm').hidden=to>=SV.keys.length;svImgs(part)}
function svCard(k){
 const m=qMeta(k),it=DB.sv[k],fids=itFolders(it),names=fids.map(folderName),all=SV.fid=='all',q=m.q,rec=DB.books[m.slug]&&DB.books[m.slug].q[m.n],fn=it.fn||{};
 const stt=!rec?['','New']:rec.s=='c'?['c','Done ✓']:rec.s=='w'?['w','Wrong earlier']:['s','Skipped'];
 const badge=fids.length>1?`<i class="b2 st">${'★'.repeat(Math.min(fids.length,5))} In ${fids.length} folders: ${esc(names.join(', '))}</i>`:(all&&names.length?`<i class="b2">${esc(names[0])}</i>`:'');
 const fnote=!all?`<label>Note for this folder only</label><textarea rows="2" data-k="${esc(k)}" data-s="${esc(SV.fid)}" oninput="setNote(this.dataset.k,this.dataset.s,this.value)" placeholder="Only shown in this folder">${esc(fn[SV.fid]||'')}</textarea>`
  :(fids.some(f=>fn[f])?'<label>Folder notes</label>'+fids.filter(f=>fn[f]).map(f=>`<div class="fnr"><b>${esc(folderName(f))}:</b> ${esc(fn[f])}</div>`).join(''):'');
 return`<div class="card sq" data-k="${esc(k)}"><div class="sqh"><b>${esc(m.subject)} · Q${m.n}</b><small>${q?esc(q.chn)+' · '+esc(q.src):'PDF not loaded'}</small><i class="b2 ${stt[0]}">${stt[1]}</i>${badge}<span class="sp"></span><button class="sm" onclick="svSave('${esc(k)}')">Folders…</button>${all?'':`<button class="sm" onclick="svRemove('${esc(k)}')">Remove from folder</button>`}</div>
 <div class="qw sqi">${q?'<small class="mu">Loading question…</small>':'<p class="mu">Add this book\'s PDF (step 2 on the home screen) to see the question.</p>'}</div>
 ${q?`<div class="bar" style="margin:6px 0"><button class="sm" onclick="this.nextElementSibling.hidden=false;this.hidden=true">Show answer</button><span hidden><b>Answer:</b> ${q.ans?esc(q.type=='S'?'('+q.ans+')':q.ans):'?'}</span></div>`:''}
 <label>Note for all folders</label><textarea rows="2" data-k="${esc(k)}" data-s="all" oninput="setNote(this.dataset.k,this.dataset.s,this.value)" placeholder="Write your note…">${esc(it.note||'')}</textarea>${fnote}</div>`}
const svSave=k=>{const m=qMeta(k);openSave(m.slug,m.n,m.subject+' Q'+m.n,()=>svList(true))};
const svRemove=k=>{setFolder(k,SV.fid,false);svList(true)};
function svImgs(keys){SVQ=SVQ.then(()=>svImgs0(keys)).catch(e=>console.error(e))}
async function svImgs0(keys){
 const fill=k=>{const el=$$('.sq').find(e=>e.dataset.k===k);if(!el)return;const m=qMeta(k);if(!m.book||!m.book.img.has(m.n))return;const im=m.book.img.get(m.n);
  el.querySelector('.sqi').innerHTML=im?`<img class="q" style="width:calc(${im.ptw}px*var(--z))" src="${im.url}" alt="">`:'<p class="no">Could not extract this question.</p>'};
 const need=new Map();
 keys.forEach(k=>{const m=qMeta(k);if(!m.book||!m.q)return;if(m.book.img.has(m.n))fill(k);else{if(!need.has(m.book))need.set(m.book,[]);need.get(m.book).push(m)}});
 for(const[bk,ms]of need)for(let i=0;i<ms.length;i+=6){const ch=ms.slice(i,i+6);
  if(!ch.some(m=>$$('.sq').some(e=>e.dataset.k===m.k)))continue;
  try{await renderBook(bk,ch.map(m=>m.q),()=>{})}catch(e){console.error(e)}
  ch.forEach(m=>fill(m.k))}}

/* =====================================================================
   Auto-load the PDFs that sit in the website's  pdfs/  folder
   ===================================================================== */
const BOOK_FILES=['pdfs/mathematics.pdf','pdfs/chemistry.pdf','pdfs/physics.pdf'];
async function autoLoad(){
 let any=false;const errs=[];
 for(let i=0;i<BOOK_FILES.length;i++){const u=BOOK_FILES[i],nm=u.split('/').pop();
  try{
   const r=await fetch(u,{cache:'no-cache'});if(!r.ok)continue;
   const buf=await r.arrayBuffer();if(String.fromCharCode(...new Uint8Array(buf.slice(0,5)))!=='%PDF-')continue;
   ov('Loading your books…',i/BOOK_FILES.length,nm);
   const b=await parseBook(new File([buf],nm),(p,n)=>ov('Loading '+nm,(i+p/n)/BOOK_FILES.length,'Page '+p+' of '+n));
   b.auto=true;const old=BOOKS.findIndex(x=>x.slug==b.slug);if(old>=0)BOOKS[old]=b;else BOOKS.push(b);any=true}
  catch(e){console.error(e);errs.push(nm+': '+(e&&e.message||e))}}
 ov(null);
 if((any||errs.length)&&$('#cBooks')){SEL.chs=new Set();rBooks();rSel();rSaved();
  if(errs.length){const m=$('#bmsg');if(m){m.textContent='Error: '+errs.join(' | ');m.className='no'}}}}

window.addEventListener('unhandledrejection',e=>{ov(null);smsg('Error: '+(e.reason&&e.reason.message||e.reason))});
setup();autoLoad();
</script></body></html>
