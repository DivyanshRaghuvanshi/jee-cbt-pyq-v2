<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JEE PYQ CBT Practice - Made by DIVYANSH</title>
<style>

*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}

.sp{flex:1}
#tm{font:600 15px "Segoe UI",sans-serif;color:#fff;white-space:nowrap}
#tm.ot{color:#ff9d85}

button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--bt);color:var(--tx);padding:8px 14px;border-radius:5px}
button:hover:not(:disabled){border-color:var(--pr)}

button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pr);outline-offset:1px}

.pri{background:var(--pr)!important;border-color:var(--pr)!important;color:#fff!important}
.dg{background:var(--na)!important;border-color:var(--na)!important;color:#fff!important}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:16px;margin-bottom:14px}

.steps{display:flex;gap:10px;align-items:baseline;margin-bottom:4px}.steps .no1{background:var(--pr);color:#fff;border-radius:50%;width:24px;height:24px;display:inline-grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.drop{border:2px dashed var(--bd);border-radius:8px;padding:18px;text-align:center;margin-top:10px;cursor:pointer;background:var(--bt)}
.drop.hov{border-color:var(--pr)}
.book{display:flex;gap:10px;align-items:center;border:1px solid var(--bd);border-radius:6px;padding:8px 12px;margin-top:8px;background:var(--bt)}
.book .bn{flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tab.on{background:var(--pr);color:#fff;border-color:var(--pr)}
.bh{display:flex;align-items:center;gap:8px;margin:14px 0 6px}
.chl{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:6px}
.chr{display:flex;align-items:center;gap:8px;padding:6px 9px;border:1px solid var(--bd);border-radius:6px;background:var(--bt);cursor:pointer;margin:0;font-weight:400;font-size:14px}
.chr.on{border-color:var(--pr);box-shadow:inset 0 0 0 1px var(--pr)}

.plan{border:1px solid var(--pr);border-radius:8px;padding:10px 14px;margin-top:14px;background:var(--bt)}

table{width:100%;border-collapse:collapse}td,th{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{white-space:nowrap}tr.r{cursor:pointer}tr.r:hover{background:var(--bt)}

/* ---------- folders / charts ---------- */

.bkw{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:6px}

<header><h1 id="ttl">JEE PYQ CBT Practice</h1><span class="by">Made by <b>DIVYANSH</b></span><span class="sp"></span><span id="tm" hidden></span><button onclick="tg()" id="thm" aria-label="Toggle dark mode">Dark mode</button></header>
<div class="wrap" id="app"></div>
<div id="ov" hidden><div class="box"><b id="ovt">Working…</b><div class="pb"><i id="ovb"></i></div><small id="ovs"></small></div></div>
<script type="module">import*as p from"./lib/pdf.min.mjs";p.GlobalWorkerOptions.workerSrc="./lib/pdf.worker.min.mjs";window.pdfjsLib=p;dispatchEvent(new Event("pdfready"))</script>
<script>
/* =====================================================================
   JEE PYQ CBT Practice  -  made by DIVYANSH
   Reads MathonGo-style "Top 500 PYQs" PDFs (questions + answer key at the end).
   Everything runs in the browser. Progress is kept in localStorage and can be
   exported / imported as a JSON file.
   ===================================================================== */
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],A=$('#app');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let STORE_FAIL=false;
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){STORE_FAIL=true}return null};
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'book';
const fmt=s=>{s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return h?h+':'+String(m).padStart(2,'0')+':'+String(x).padStart(2,'0'):m+':'+String(x).padStart(2,'0')};
const SC=2.5; /* render scale for question images */

/* ---------- theme ---------- */
function theme(t){document.documentElement.classList.toggle('dark',t=='dark');$('#thm').textContent=t=='dark'?'Light mode':'Dark mode';ls('jp_theme',t)}
function tg(){theme(document.documentElement.classList.contains('dark')?'light':'dark')}
theme(ls('jp_theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));

/* ---------- settings (remembered) ---------- */
const CFG=Object.assign({tm:'q',mins:2,mp:4,mn:4,shuf:false,auto:true,z:1.5,name:'',mode:'ch',rule:'all',n:5,a:1,b:5,filt:['new','skipped']},(()=>{try{return JSON.parse(ls('jp_cfg')||'{}')}catch(e){return{}}})());
const saveCfg=()=>ls('jp_cfg',JSON.stringify(CFG));
document.documentElement.style.setProperty('--z',CFG.z);

/* ---------- progress database ---------- */
function loadDB(){try{const d=JSON.parse(ls('jp_db')||'null');if(d&&d.books)return{books:d.books,hist:d.hist||[],folders:d.folders||{},sv:d.sv||{}}}catch(e){}return{books:{},hist:[],folders:{},sv:{}}}
let DB=loadDB();
const saveDB=()=>ls('jp_db',JSON.stringify(DB));
const setDirty=v=>ls('jp_dirty',v?'1':'0');
const isDirty=()=>ls('jp_dirty')=='1';
const st=(b,n)=>{const r=DB.books[b.slug]&&DB.books[b.slug].q[n];return!r?'new':r.s=='c'?'correct':r.s=='w'?'wrong':'skipped'};

/* ---------- state ---------- */
let BOOKS=[],S=null,iv=null,PL=null;

/* =====================================================================
   PDF reading
   ===================================================================== */
function rowsText(items){ /* items -> text in reading order (row by row) */
 const a=items.slice().sort((p,q)=>p.y-q.y||p.x-q.x),L=[];
 for(const it of a){const l=L[L.length-1];if(l&&Math.abs(l.y-it.y)<=3)l.it.push(it);else L.push({y:it.y,it:[it]})}
 return L.map(l=>l.it.sort((p,q)=>p.x-q.x).map(i=>i.s).join(' ')).join(' ')}
function parseKey(text){const m={},re=/(\d{1,4})\s*\.\s*(\(\s*[1-4]\s*\)|[-−–]?\s*\d+(?:\.\d+)?)/g;let x;
 while((x=re.exec(text))){const n=+x[1];if(m[n]!==undefined)continue;const v=x[2].replace(/\s+/g,'').replace(/[−–]/g,'-');m[n]=v[0]=='('?{t:'S',a:v.replace(/[()]/g,'')}:{t:'N',a:v}}
 return m}

async function parseBook(file,onp){
 await pdfReady();
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,N=pdf.numPages;
 const pages=[],keyItems=[];let keyP=0,keyY=0,title='';
 for(let p=1;p<=N;p++){
  onp&&onp(p,N);
  const pg=await pdf.getPage(p),vp=pg.getViewport({scale:1}),W=vp.width,H=vp.height,tc=await pg.getTextContent(),I=[];
  for(const it of tc.items){const s=(it.str||'').trim();if(!s)continue;const[x,y]=vp.convertToViewportPoint(it.transform[4],it.transform[5]);I.push({s,x,y,h:it.height||10,w:it.width||0})}
  pg.cleanup();
  const P={p,W,H,marks:[],opt:[],top0:.07*H,bot:.93*H};
  const hd=I.filter(i=>i.y<.075*H);
  if(hd.length){P.top0=Math.max(...hd.map(i=>i.y))+8;if(!title){const t=rowsText(hd).replace(/\s*MathonGo\s*$/i,'').trim();if(/PYQ|Top\s*\d+/i.test(t))title=t}}
  const ft=I.find(i=>/^Text\s*&\s*Video/i.test(i.s));if(ft)P.bot=ft.y-11;
  const kh=I.find(i=>/^ANSWER\s*KEYS?$/i.test(i.s));
  if(kh&&!keyP){keyP=p;keyY=kh.y}
  const isKey=keyP&&p>=keyP;
  if(isKey){for(const i of I){if(p===keyP&&i.y<=keyY+1)continue;if(i.y<P.top0||i.y>P.bot+4)continue;keyItems.push({p,x:i.x,y:i.y,s:i.s})}}
  if(!(isKey&&p>keyP)){
   for(const i of I){
    if(isKey&&p===keyP&&i.y>keyY+1)continue;
    let m;
    if(i===kh){P.marks.push({t:'k',y:i.y,top:i.y-i.h-2})}
    else if(i.x<.2*W&&(m=i.s.match(/^Q\s*(\d+)\s*\.\s*(.*)$/))){
     const line=I.filter(o=>o!==i&&Math.abs(o.y-i.y)<2.5&&o.x>i.x).sort((a,b)=>a.x-b.x);
     const title2=(m[2]+' '+line.map(o=>o.s).join(' ')).trim(),x1=Math.max(i.x+i.w,...line.map(o=>o.x+o.w));
     P.marks.push({t:'q',n:+m[1],title:title2,y:i.y,top:i.y-i.h-1.5,mask:{x0:i.x-3,x1:x1+3,y0:i.y-i.h-1.5,y1:i.y+i.h*.4}})}
    else if(i.x<.2*W&&/^Chapter\s*:/i.test(i.s)){
     let name=i.s.replace(/^Chapter\s*:\s*/i,'').trim();
     if(!name){const o=I.filter(o=>o!==i&&Math.abs(o.y-i.y)<2.5&&o.x>i.x).sort((a,b)=>a.x-b.x);name=o.map(z=>z.s).join(' ')}
     P.marks.push({t:'c',name,y:i.y,top:i.y-i.h-2})}
    if(/^\(\s*1\s*\)/.test(i.s))P.opt.push(i.y)}
  }
  pages.push(P)}
 /* ---- build the question index ---- */
 const chs=[],cmap=new Map(),qs=[];let cur=null,last=null,lastN=0;
 const chap=name=>{const k=name.toLowerCase().replace(/[^a-z0-9]+/g,'');let c=cmap.get(k);if(!c){c={name:name||'Questions',qs:[]};cmap.set(k,c);chs.push(c)}return c};
 for(const P of pages){
  if(keyP&&P.p>keyP)break;
  let ms=P.marks.slice().sort((a,b)=>a.y-b.y),ln=lastN;
  ms=ms.filter(m=>{if(m.t!='q')return true;if(m.n<=ln)return false;ln=m.n;return true});
  const e0=ms.length?ms[0].top:P.bot;
  if(last&&e0-P.top0>4&&!(ms.length&&ms[0].t=='k'))last.segs.push({p:P.p,y0:P.top0,y1:e0});
  const prev=last;
  ms.forEach((m,i)=>{
   if(m.t=='c'){cur=chap(m.name);return}
   if(m.t!='q')return;
   if(!cur)cur=chap('All questions');
   const nx=ms[i+1],q={n:m.n,src:m.title,chn:cur.name,segs:[{p:P.p,y0:m.top,y1:nx?nx.top:P.bot,mk:m.mask}],opt1:false,ans:null,type:null};
   qs.push(q);cur.qs.push(q);last=q;lastN=m.n;m.q=q});
  for(const y of P.opt){let o=null;for(const m of ms)if(m.t=='q'&&m.y<=y)o=m.q;o=o||prev;if(o)o.opt1=true}
 }
 /* ---- answer key ---- */
 const byP={};keyItems.forEach(k=>(byP[k.p]=byP[k.p]||[]).push(k));
 const key=parseKey(Object.keys(byP).sort((a,b)=>a-b).map(p=>rowsText(byP[p])).join(' '));
 const warn=[];let nk=0;
 for(const q of qs){const k=key[q.n];if(k){q.ans=k.a;q.type=k.t;nk++}else{q.type=q.opt1?'S':'N'}}
 if(!qs.length)throw new Error('no questions found - is this a MathonGo "Top 500 PYQs" PDF?');
 if(!keyP)warn.push('No "ANSWER KEYS" page was found, so results cannot be graded.');
 else if(nk<qs.length)warn.push('Answers are missing for '+(qs.length-nk)+' question(s); they will be shown as ungraded.');
 const gaps=[];for(let i=1;i<qs.length;i++)if(qs[i].n!=qs[i-1].n+1)gaps.push(qs[i-1].n+1);
 if(gaps.length)warn.push('Question numbers skipped near Q'+gaps.slice(0,5).join(', Q')+' - those could not be read.');
 const chapters=chs.filter(c=>c.qs.length);chapters.forEach(c=>c.qs.forEach(q=>q.ci=chapters.indexOf(c)));
 title=title||file.name.replace(/\.pdf$/i,'');
 return{slug:slug(title),name:title,subject:title.split(/\s+Top\s+\d+/i)[0].trim()||title,file:file.name,pages:N,pdf,qs,chapters,nk,warn,img:new Map(),byNum:new Map(qs.map(q=>[q.n,q]))}
}

/* ---- render selected questions to images ---- */
function crop(cx,W,H,a,b){
 a=Math.max(0,Math.floor(a));b=Math.min(H,Math.ceil(b));const h=b-a;if(h<6)return null;
 const x0=Math.floor(W*.05),w=Math.floor(W*.97)-x0,d=cx.getImageData(x0,a,w,h).data;let f=-1,l=-1;
 for(let r=0;r<h;r++){for(let c=0;c<w;c+=2){const i=(r*w+c)*4;if(d[i]+d[i+1]+d[i+2]<390){if(f<0)f=r;l=r;break}}}
 if(f<0)return null;
 const y0=Math.max(0,f-8),y1=Math.min(h,l+10),c2=document.createElement('canvas');c2.width=w;c2.height=y1-y0;
 const g=c2.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,w,y1-y0);g.drawImage(cx.canvas,x0,a+y0,w,y1-y0,0,0,w,y1-y0);return c2}
async function renderBook(bk,qs,cb){
 const byPage=new Map(),pieces=new Map();
 qs.forEach(q=>q.segs.forEach(sg=>{if(!byPage.has(sg.p))byPage.set(sg.p,[]);byPage.get(sg.p).push({q,sg})}));
 const pgs=[...byPage.keys()].sort((a,b)=>a-b);let k=0;
 for(const p of pgs){
  cb(k/pgs.length,'Page '+p+' ('+(k+1)+' of '+pgs.length+')');
  const pg=await bk.pdf.getPage(p),vp=pg.getViewport({scale:SC}),cv=document.createElement('canvas');
  cv.width=Math.ceil(vp.width);cv.height=Math.ceil(vp.height);
  const cx=cv.getContext('2d',{willReadFrequently:true});cx.fillStyle='#fff';cx.fillRect(0,0,cv.width,cv.height);
  await pg.render({canvasContext:cx,viewport:vp}).promise;
  for(const{q,sg}of byPage.get(p)){
   if(sg.mk){cx.fillStyle='#fff';cx.fillRect(sg.mk.x0*SC,sg.mk.y0*SC,(sg.mk.x1-sg.mk.x0)*SC,(sg.mk.y1-sg.mk.y0)*SC)}
   const c=crop(cx,cv.width,cv.height,sg.y0*SC,sg.y1*SC);if(c){if(!pieces.has(q))pieces.set(q,[]);pieces.get(q).push(c)}}
  pg.cleanup();k++;await new Promise(r=>setTimeout(r,0))}
 for(const q of qs){
  const ps=pieces.get(q);if(!ps||!ps.length){bk.img.set(q.n,null);continue}
  const w=Math.max(...ps.map(c=>c.width)),h=ps.reduce((a,c)=>a+c.height+4,0),c=document.createElement('canvas');
  c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);let y=0;ps.forEach(s=>{x.drawImage(s,0,y);y+=s.height+4});
  bk.img.set(q.n,{url:c.toDataURL('image/jpeg',.9),ptw:Math.round(w/SC),np:ps.length})}
}

function bookStats(b){let c=0,w=0,u=0;for(const n in b.q){const s=b.q[n].s;s=='c'?c++:s=='w'?w++:u++}return{c,w,u}}
function rProg(){

 const rows=ks.map(k=>{const b=DB.books[k],s=bookStats(b);return`<tr><td>${esc(b.name||k)}</td><td class="ok">${s.c}</td><td class="no">${s.w}</td><td class="sk">${s.u}</td><td>${s.c+s.w+s.u}</td></tr>`}).join('');
 e.innerHTML=`<div class="card"><div class="steps"><span class="no1">1</span><h2>Your progress <small>(optional)</small></h2></div>
 <small>Coming back? Load the progress file you downloaded last time so the app knows which questions you already did, got wrong or skipped. First time? Skip this step.</small>
 ${rows?`<table style="margin-top:10px"><tr><th>Book</th><th>Correct</th><th>Wrong</th><th>Skipped</th><th>Total done</th></tr>${rows}</table>`:'<p class="mu" style="margin:10px 0 0">No saved progress yet.</p>'}

function dl(){
 const b=new Blob([JSON.stringify({app:'jee-pyq',v:3,at:new Date().toISOString(),books:DB.books,hist:DB.hist,folders:DB.folders,sv:DB.sv})],{type:'application/json'}),a=document.createElement('a');
 a.href=URL.createObjectURL(b);a.download='jee-pyq-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);

async function imp(i){
 const f=i.files[0];let t,cl='no';if(!f)return;
 try{const d=JSON.parse(await f.text());if(d.app!=='jee-pyq'||!d.books)throw 0;let nq=0;
  for(const k in d.books){const src=d.books[k],dst=DB.books[k]||(DB.books[k]={name:src.name,q:{}});dst.name=dst.name||src.name;
   for(const n in src.q){const a=dst.q[n],b=src.q[n];if(!a||(b.ts||0)>(a.ts||0)){dst.q[n]=b;nq++}}}
  const ids=new Set(DB.hist.map(h=>h.id));let nh=0;(d.hist||[]).forEach(h=>{if(!ids.has(h.id)){DB.hist.push(h);nh++}});
  DB.hist.sort((a,b)=>a.ts-b.ts);
  let nf=0;const F=d.folders||{},V=d.sv||{};
  for(const id in F){const a=DB.folders[id];if(!a||(F[id].ts||0)>(a.ts||0)){DB.folders[id]=F[id];nf++}}
  for(const k in V){const a=DB.sv[k];if(!a||(V[k].ts||0)>(a.ts||0)){DB.sv[k]=V[k]}}
  saveDB();t='Loaded '+nq+' question record(s), '+nh+' past test(s)'+(Object.keys(F).length?' and your folders & notes':'')+'.';cl='ok';setDirty(false)}
 catch(e){t='That file is not a progress file made by this app.'}
 i.value='';rDirty();rProg();rBooks();rSel();rHist();const m=$('#dmsg');if(m){m.textContent=t;m.className=cl}}
function resetAll(){if(!confirm('Delete ALL saved progress, test history, folders and notes from this browser? (Download a backup first if unsure.)'))return;DB={books:{},hist:[],folders:{},sv:{}};saveDB();setDirty(false);rDirty();rProg();rBooks();rSel();rHist()}

async function addPdfs(files){
 const msg=t=>{const m=$('#bmsg');if(m){m.textContent=t;m.className=t&&t.startsWith('Error')?'no':'mu'}};
 for(const f of [...files]){
  if(!/\.pdf$/i.test(f.name)&&f.type!='application/pdf'){msg('Error: '+f.name+' is not a PDF.');continue}
  try{ov('Reading '+f.name,0,'Finding chapters, questions and the answer key…');
   const b=await parseBook(f,(p,n)=>ov('Reading '+f.name,p/n,'Page '+p+' of '+n));
   const old=BOOKS.findIndex(x=>x.slug==b.slug);if(old>=0)BOOKS[old]=b;else BOOKS.push(b);
   SEL.chs=new Set([...SEL.chs].filter(k=>BOOKS[+k.split(':')[0]]));msg('')}
  catch(e){console.error(e);msg('Error: could not read '+f.name+' - '+(e&&e.message||e))}
 }
 ov(null);SEL.chs=new Set();rBooks();rSel()}

/* ---- step 3: choose questions ---- */
function parseNums(s){const r=new Set();String(s).split(/[,;\s]+/).forEach(p=>{const m=p.trim().match(/^(\d+)(?:\s*[-–]\s*(\d+))?$/);if(m){const a=+m[1],b=+(m[2]||m[1]);for(let i=Math.min(a,b);i<=Math.max(a,b)&&i<5000;i++)r.add(i)}});return r}
function sample(a,n){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function plan(){
 const items=[],per=[];let hidden=0,missing=0;
 const take=(bk,list,rule)=>{ /* list already in chapter/number order */
  const before=list.length;list=list.filter(q=>FILT.has(st(bk,q.n)));hidden+=before-list.length;
  if(rule=='first')list=list.slice(0,Math.max(1,CFG.n));
  if(rule=='rand')list=sample(list,Math.max(1,CFG.n)).sort((a,b)=>a.n-b.n);
  list.forEach(q=>items.push({bk,q}))};
 if(CFG.mode=='ch'){
  BOOKS.forEach((bk,bi)=>bk.chapters.forEach((c,ci)=>{if(!SEL.chs.has(bi+':'+ci))return;let l=c.qs;
   if(CFG.rule=='range'){const a=Math.min(CFG.a,CFG.b),b=Math.max(CFG.a,CFG.b);l=l.filter((q,i)=>i+1>=a&&i+1<=b)}
   take(bk,l,CFG.rule)}))}
 else if(CFG.mode=='fo'){const seen=new Set(),tmp=[];
  [...SEL.fo].forEach(fid=>savedKeys(fid).forEach(k=>{if(seen.has(k))return;seen.add(k);const m=qMeta(k);if(m.book&&m.q)tmp.push({bk:m.book,q:m.q});else missing++}));
  tmp.sort((a,b)=>BOOKS.indexOf(a.bk)-BOOKS.indexOf(b.bk)||a.q.n-b.q.n);items.push(...tmp)}
 else{const bk=BOOKS[SEL.bk];if(bk){
  if(CFG.mode=='num'){const ns=parseNums(SEL.nums);take(bk,bk.qs.filter(q=>ns.has(q.n)),'all')}
  else{const ps=parseNums(SEL.pages);take(bk,bk.qs.filter(q=>ps.has(q.segs[0].p)),'all')}}}
 if(CFG.shuf){const by=new Map();items.forEach(x=>{if(!by.has(x.bk))by.set(x.bk,[]);by.get(x.bk).push(x)});items.length=0;BOOKS.forEach(b=>{if(by.has(b))items.push(...sample(by.get(b),1e9))})}
 return{items,hidden,missing}}
function rSel(){
 const e=$('#cSel');
 if(!BOOKS.length){e.innerHTML='<div class="card"><div class="steps"><span class="no1">3</span><h2>Choose questions</h2></div><small>Add a PDF in step 2 first.</small></div>';PL=null;return}
 if(SEL.bk>=BOOKS.length)SEL.bk=0;
 const bsel=BOOKS.length>1?`<label>Which book?</label><select onchange="SEL.bk=+this.value;refreshPlan()">${BOOKS.map((b,i)=>`<option value="${i}" ${i==SEL.bk?'selected':''}>${esc(b.subject)}</option>`).join('')}</select>`:'';
 const tabs=[['ch','By chapters'],['num','By question numbers'],['pg','By pages'],['fo','From saved folders']].map(([k,t])=>`<button class="tab ${CFG.mode==k?'on':''}" onclick="CFG.mode='${k}';saveCfg();rSel()">${t}</button>`).join('');
 let panel='';
 if(CFG.mode=='ch'){
  panel=BOOKS.map((b,bi)=>`<div class="bh"><b>${esc(b.subject)}</b><small>${b.qs.length} questions</small><span class="sp"></span><button class="sm" onclick="selAll(${bi},1)">Select all</button><button class="sm" onclick="selAll(${bi},0)">Clear</button></div>
   <div class="chl">${b.chapters.map((c,ci)=>{const k=bi+':'+ci,n={new:0,skipped:0,wrong:0,correct:0};c.qs.forEach(q=>n[st(b,q.n)]++);const on=SEL.chs.has(k);
    return`<label class="chr ${on?'on':''}" data-k="${k}"><input type="checkbox" ${on?'checked':''} onchange="togCh('${k}',this.checked,this.parentNode)"><span class="cn">${esc(c.name)}</span>${n.wrong?`<i class="b2 w">${n.wrong} wrong</i>`:''}${n.skipped?`<i class="b2 s">${n.skipped} skipped</i>`:''}${n.correct?`<i class="b2 c">${n.correct} done</i>`:''}<span class="cc"><b class="mc"></b>/${c.qs.length}</span></label>`}).join('')}</div>`).join('')+
  `<div class="g4" style="margin-top:12px"><div><label>From each selected chapter take</label><select onchange="CFG.rule=this.value;saveCfg();rSel()">${[['all','All matching questions'],['first','First N questions'],['range','Questions a to b (position in chapter)'],['rand','Random N questions']].map(([v,t])=>`<option value="${v}" ${CFG.rule==v?'selected':''}>${t}</option>`).join('')}</select></div>
   ${CFG.rule=='first'||CFG.rule=='rand'?`<div><label>N (per chapter)</label><input type="number" min="1" value="${CFG.n}" oninput="CFG.n=Math.max(1,+this.value||1);saveCfg();refreshPlan()"></div>`:''}

 const tried=R.filter((x,i)=>prev[i]);
 if(tried.length){
  const imp=tried.filter(x=>prev[x.i]!='c'&&x.s=='ok').length,sl2=tried.filter(x=>prev[x.i]=='c'&&x.s=='no').length,sw2=tried.filter(x=>prev[x.i]=='w'&&x.s=='no').length,keep=tried.filter(x=>prev[x.i]=='c'&&x.s=='ok').length;
  const p=[];if(imp)p.push(`<b>${imp}</b> improved`);if(keep)p.push(`<b>${keep}</b> stayed correct`);if(sw2)p.push(`<b>${sw2}</b> still wrong`);if(sl2)p.push(`<b>${sl2}</b> slipped from correct to wrong`);

function chFocus(c,avg){

function niceMax(mx){const st=[5,10,15,30,60,120,180,300,600,900,1800,3600,7200],s=st.find(v=>mx/v<=4)||7200;return{s,top:Math.ceil(mx/s)*s}}

/* time per question: one bar each, plus the average and the allowed time */
function gTime(W){
 const R=Z.R,n=R.length,H=240,L=48,Rr=12,T=14,B=28,WW=Math.max(W,n*9+L+Rr),bud=S.tot/n;
 const nm=niceMax(Math.max(1,...R.map(x=>x.t),Z.avg,bud)),Y=v=>T+(1-v/nm.top)*(H-T-B);
 const slot=(WW-L-Rr)/n,bw=Math.max(3,Math.min(26,slot*.7)),step=Math.max(1,Math.ceil(n/Math.max(1,Math.floor((WW-L-Rr)/26)))),y0=Y(0);
 let g=gridY(L,WW-Rr,Y,nm);
 R.forEach((x,i)=>{const bx=L+i*slot+(slot-bw)/2,h=Math.max(2,y0-Y(x.t));
  g+=`<rect class="f-${x.s}" x="${bx.toFixed(1)}" y="${(y0-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="2" onclick="goRev(${i})" style="cursor:pointer"><title>Q${i+1}: ${fmt(x.t)} - ${rlab(x)}</title></rect>`;
  if(i%step==0)g+=`<text class="gt" x="${(bx+bw/2).toFixed(1)}" y="${H-9}" text-anchor="middle">${i+1}</text>`});
 g+=`<line class="la" x1="${L}" x2="${WW-Rr}" y1="${Y(Z.avg)}" y2="${Y(Z.avg)}"/><line class="lb" x1="${L}" x2="${WW-Rr}" y1="${Y(bud)}" y2="${Y(bud)}"/>`;
 return`<svg width="${WW}" height="${H}" viewBox="0 0 ${WW} ${H}" role="img" aria-label="Time spent on each question">${g}</svg>`}

/* running clock: cumulative time against an even pace */
function gClock(W){
 const R=Z.R,n=R.length,H=230,L=52,Rr=18,T=16,B=30;let c=0;const cum=[0].concat(R.map(x=>c+=x.t));
 const nm=niceMax(Math.max(S.tot,cum[n])),X=i=>L+i*(W-L-Rr)/n,Y=v=>T+(1-v/nm.top)*(H-T-B),step=Math.max(1,Math.ceil(n/Math.max(1,Math.floor((W-L-Rr)/28))));
 let g=gridY(L,W-Rr,Y,nm);
 g+=`<path d="M${X(0)},${Y(0)} ${cum.map((v,i)=>`L${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ')} L${X(n)},${Y(0)}Z" fill="var(--pr)" fill-opacity=".14"/>`;
 g+=`<line class="la" style="stroke:var(--wa)" x1="${X(0)}" y1="${Y(0)}" x2="${X(n)}" y2="${Y(S.tot)}"/>`;
 g+=`<polyline fill="none" stroke="var(--pr)" stroke-width="2.4" stroke-linejoin="round" points="${cum.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`;
 if(n<=60)cum.forEach((v,i)=>{if(i)g+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="2.6" fill="var(--pr)"><title>After Q${i}: ${fmt(v)} used (even pace: ${fmt(S.tot*i/n)})</title></circle>`});
 for(let i=1;i<=n;i++)if(i%step==0||i==1)g+=`<text class="gt" x="${X(i).toFixed(1)}" y="${H-9}" text-anchor="middle">${i}</text>`;
 g+=`<circle cx="${X(n)}" cy="${Y(cum[n])}" r="4.5" fill="var(--pr)"/><text class="gt" style="fill:var(--tx);font-weight:600" x="${X(n)-8}" y="${Y(cum[n])-9}" text-anchor="end">${fmt(cum[n])} used</text>`;
 return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative time used against an even pace">${g}</svg>`}

/* radar: labels wrap onto two lines and are given room from the real width */
function wrapL(s,m){
 const w=s.split(/\s+/).filter(Boolean),L=[];let cur='';
 for(let i=0;i<w.length;i++){
  if(!cur)cur=w[i];else if((cur+' '+w[i]).length<=m)cur+=' '+w[i];else{L.push(cur);cur=w.slice(i).join(' ');break}}
 L.push(cur);return L.slice(0,2).map(l=>l.length>m?l.slice(0,m-1)+'…':l)}
function gRadar(W){
 const top=new Set(Z.chs.slice().sort((a,b)=>b.n-a.n).slice(0,12)),cs=Z.chs.filter(c=>top.has(c)),n=cs.length;
 const nm=cs.map(c=>c.ch),dup=new Set(nm.filter((x,i)=>nm.indexOf(x)!=i));
 const H=W<480?340:380,cx=W/2,cy=H/2,lw=Math.max(76,Math.min(200,W*.25)),R=Math.max(46,Math.min(cy-34,cx-lw-12)),cpl=Math.max(9,Math.floor(lw/(W<480?5.7:6.4)));
 const ang=k=>-Math.PI/2+2*Math.PI*k/n,P=(k,v)=>[cx+R*v/100*Math.cos(ang(k)),cy+R*v/100*Math.sin(ang(k))],pts=f=>cs.map((c,k)=>P(k,f(c)).map(v=>v.toFixed(1)).join(',')).join(' ');
 let g='';
 [25,50,75,100].forEach(v=>{g+=`<polygon points="${pts(()=>v)}" fill="none" class="gl"/>`});
 cs.forEach((c,k)=>{const[x,y]=P(k,100);g+=`<line class="gl" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`});
 [50,100].forEach(v=>g+=`<text class="gt" x="${cx+4}" y="${(cy-R*v/100+11).toFixed(1)}" style="font-size:10px">${v}</text>`);
 const A1=c=>Math.round(c.c/c.n*100),B1=c=>c.acc||0;
 g+=`<polygon points="${pts(A1)}" fill="var(--pr)" fill-opacity=".22" stroke="var(--pr)" stroke-width="2" stroke-linejoin="round"/><polygon points="${pts(B1)}" fill="var(--an)" fill-opacity=".1" stroke="var(--an)" stroke-width="2" stroke-linejoin="round"/>`;
 cs.forEach((c,k)=>{const tip=`${esc(c.k)}: ${c.c} of ${c.n} correct (${A1(c)}%), accuracy on attempted ${c.acc==null?'-':c.acc+'%'}`;
  [[A1(c),'var(--pr)'],[B1(c),'var(--an)']].forEach(([v,col])=>{const[x,y]=P(k,v);g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.6" fill="${col}"><title>${tip}</title></circle>`});
  const cs2=Math.cos(ang(k)),sn=Math.sin(ang(k)),[lx,ly]=[cx+(R+12)*cs2,cy+(R+12)*sn],an=cs2>.3?'start':cs2<-.3?'end':'middle',ls=wrapL(dup.has(c.ch)?c.k:c.ch,cpl);
  const y0=sn<-.55?ly-(ls.length-1)*14-4:sn>.55?ly+13:ly+4-(ls.length-1)*7;
  g+=`<text class="rl" ${W<480?'style="font-size:11px" ':''}text-anchor="${an}" x="${lx.toFixed(1)}" y="${y0.toFixed(1)}"><title>${esc(c.k)}</title>${ls.map((l,j)=>`<tspan x="${lx.toFixed(1)}" dy="${j?14:0}">${esc(l)}</tspan>`).join('')}</text>`});
 return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chapter radar">${g}</svg>`}

/* score trend: fills the width of its card */
function gTrend(W){
 const a=DB.hist.slice(-12),off=DB.hist.length-a.length,H=240,L=46,Rr=20,T=16,B=32;
 if(a.length<2)return'';
 const pts=a.map(x=>x.max?Math.round(100*x.score/x.max):0),acc=a.map(x=>x.acc||0),lo=Math.min(0,...pts),hi=100;
 const X=i=>L+i*(W-L-Rr)/(a.length-1),Y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
 const line=(vs,c,nm)=>`<polyline fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round" points="${vs.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ')}"/>`+vs.map((v,i)=>`<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="${i==vs.length-1?5:3.6}" fill="${c}"><title>${esc(a[i].name)} - ${nm}: ${v}%</title></circle>`).join('');
 let g='';[...new Set([lo,0,50,100])].forEach(v=>{g+=`<line class="gl" x1="${L}" y1="${Y(v)}" x2="${W-Rr}" y2="${Y(v)}"${v==0&&lo<0?' style="stroke:var(--mu)"':''}/><text class="gt" x="${L-7}" y="${Y(v)+4}" text-anchor="end">${v}%</text>`});
 a.forEach((x,i)=>{g+=`<text class="gt" x="${X(i).toFixed(1)}" y="${H-10}" text-anchor="middle">${off+i+1}</text>`});
 return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Score trend across your last tests">${g}${line(acc,'var(--an)','accuracy')}${line(pts,'var(--pr)','score')}</svg>`}

let pt=null;
function persist(){setDirty(true);clearTimeout(pt);pt=setTimeout(()=>{pt=null;saveDB()},300);rDirty()}
const uid=()=>'f'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const activeFolders=()=>Object.entries(DB.folders).filter(([,f])=>!f.del).sort((a,b)=>(a[1].c||0)-(b[1].c||0)).map(([id,f])=>({id,name:f.name}));
const folderName=id=>DB.folders[id]&&!DB.folders[id].del?DB.folders[id].name:null;
const itFolders=it=>(it&&it.f||[]).filter(folderName);
const isSaved=k=>itFolders(DB.sv[k]).length>0;
const splitK=k=>{const i=k.lastIndexOf('#');return{slug:k.slice(0,i),n:+k.slice(i+1)}};
const bIdx=s=>{const i=BOOKS.findIndex(b=>b.slug==s);return i<0?99:i};
function qMeta(k){const{slug,n}=splitK(k),book=BOOKS.find(b=>b.slug==slug)||null,q=book?book.byNum.get(n)||null:null;
 return{k,slug,n,book,q,subject:book?book.subject:((DB.books[slug]&&DB.books[slug].name)||slug)}}
function savedKeys(fid){return Object.keys(DB.sv).filter(k=>{const f=itFolders(DB.sv[k]);return fid&&fid!=='all'?f.includes(fid):f.length>0}).sort((a,b)=>{const x=splitK(a),y=splitK(b);return bIdx(x.slug)-bIdx(y.slug)||x.slug.localeCompare(y.slug)||x.n-y.n})}
function mkFolder(name){name=(name||'').trim().slice(0,60);if(!name)return null;
 const ex=Object.entries(DB.folders).find(([,f])=>!f.del&&f.name.toLowerCase()==name.toLowerCase());if(ex)return ex[0];
 const id=uid();DB.folders[id]={name,c:Date.now(),ts:Date.now()};persist();return id}
const item=k=>DB.sv[k]||(DB.sv[k]={f:[],note:'',fn:{},ts:0});
function setFolder(k,fid,on){const it=item(k),has=it.f.includes(fid);if(on&&!has)it.f.push(fid);if(!on&&has)it.f=it.f.filter(x=>x!=fid);it.ts=Date.now();persist()}
function setNote(k,scope,text){const it=item(k);if(scope=='all')it.note=text;else{it.fn=it.fn||{};it.fn[scope]=text}it.ts=Date.now();persist()}
function renameFolder(fid){const f=DB.folders[fid];if(!f)return;const n=prompt('Folder name',f.name);if(n&&n.trim()){f.name=n.trim().slice(0,60);f.ts=Date.now();persist()}}
function deleteFolder(fid){const f=DB.folders[fid];if(!f)return false;
 if(!confirm('Delete folder "'+f.name+'"? The questions stay in your other folders; notes written only for this folder are lost.'))return false;
 f.del=true;f.ts=Date.now();Object.values(DB.sv).forEach(it=>{if(it.f.includes(fid)){it.f=it.f.filter(x=>x!=fid);if(it.fn)delete it.fn[fid];it.ts=Date.now()}});persist();return true}

async function svImgs0(keys){
 const fill=k=>{const el=$$('.sq').find(e=>e.dataset.k===k);if(!el)return;const m=qMeta(k);if(!m.book||!m.book.img.has(m.n))return;const im=m.book.img.get(m.n);
  el.querySelector('.sqi').innerHTML=im?`<img class="q" style="width:calc(${im.ptw}px*var(--z))" src="${im.url}" alt="">`:'<p class="no">Could not extract this question.</p>'};
 const need=new Map();
 keys.forEach(k=>{const m=qMeta(k);if(!m.book||!m.q)return;if(m.book.img.has(m.n))fill(k);else{if(!need.has(m.book))need.set(m.book,[]);need.get(m.book).push(m)}});
 for(const[bk,ms]of need)for(let i=0;i<ms.length;i+=6){const ch=ms.slice(i,i+6);
  if(!ch.some(m=>$$('.sq').some(e=>e.dataset.k===m.k)))continue;
  try{await renderBook(bk,ch.map(m=>m.q),()=>{})}catch(e){console.error(e)}
  ch.forEach(m=>fill(m.k))}}

/* =====================================================================
   Auto-load the PDFs that sit in the website's  pdfs/  folder
   ===================================================================== */
const BOOK_FILES=['pdfs/mathematics.pdf','pdfs/chemistry.pdf','pdfs/physics.pdf'];
async function autoLoad(){
 let any=false;const errs=[];
 for(let i=0;i<BOOK_FILES.length;i++){const u=BOOK_FILES[i],nm=u.split('/').pop();
  try{
   const r=await fetch(u,{cache:'no-cache'});if(!r.ok)continue;
   const buf=await r.arrayBuffer();if(String.fromCharCode(...new Uint8Array(buf.slice(0,5)))!=='%PDF-')continue;
   ov('Loading your books…',i/BOOK_FILES.length,nm);
   const b=await parseBook(new File([buf],nm),(p,n)=>ov('Loading '+nm,(i+p/n)/BOOK_FILES.length,'Page '+p+' of '+n));
   b.auto=true;const old=BOOKS.findIndex(x=>x.slug==b.slug);if(old>=0)BOOKS[old]=b;else BOOKS.push(b);any=true}
  catch(e){console.error(e);errs.push(nm+': '+(e&&e.message||e))}}
 ov(null);
 if((any||errs.length)&&$('#cBooks')){SEL.chs=new Set();rBooks();rSel();rSaved();
  if(errs.length){const m=$('#bmsg');if(m){m.textContent='Error: '+errs.join(' | ');m.className='no'}}}}

window.addEventListener('unhandledrejection',e=>{ov(null);smsg('Error: '+(e.reason&&e.reason.message||e.reason))});
setup();autoLoad();
</script></body></html>
